# The "doorman" of the container: one public port (7860), two servers behind it.
#   /live/...        -> the live voice server (FastAPI, port 8000)
#   everything else  -> the Streamlit app (port 8501)
# Written to run as a normal user (Hugging Face does not run containers as root): all temp files go to /tmp.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    client_body_temp_path /tmp/nginx_body;
    proxy_temp_path /tmp/nginx_proxy;
    fastcgi_temp_path /tmp/nginx_fastcgi;
    uwsgi_temp_path /tmp/nginx_uwsgi;
    scgi_temp_path /tmp/nginx_scgi;
    client_max_body_size 200m;              # PDF uploads (Streamlit's own limit is 200 MB)

    # Streamlit talks to the browser over a WebSocket: these lines let it pass through
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 7860;

        # the "/" at the end of both lines removes "/live" from the path: the voice server sees /session
        location /live/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_set_header Host $host;
            proxy_read_timeout 120s;
        }

        location / {
            proxy_pass http://127.0.0.1:8501;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;      # keep the WebSocket open (one day)
        }
    }
}
